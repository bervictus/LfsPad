[General]
; tr=Turkish, en=English
Language=tr
InSimPort=29999
; Allow InSim clients from other machines (0=local only, 1=allow remote)
AllowRemoteInSim=0
Diagnostics=0

[Input]
; 0=automatic, 1..4=XInput slot, 5=native gamepad or mapped USB adapter
