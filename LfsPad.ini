CursorSpeed=900
; Corner controller prompts and button icons: 0=off, 1=on
ControllerIcons=1
; Independent XInput pedal axes (0=off, 1=on)
SplitTriggers=1
; Race quick menu: 0=off 1=Back 2=L3 3=R3
QuickMenu=1
; Compact raw and forwarded input display: 0=off, 1=on
InputMonitor=0
; Driving vibration strength (0..100, 0=off)
RumbleStrength=50
; Button indices: 0=A, 1=B, 2=X, 3=Y, 4=LB, 5=RB,
; 6=Start, 7=Back, 8=R3, 9=L3, 10=Up, 11=Down, 12=Left, 13=Right.
; Duplicate assignments are swapped.
Confirm=0
Back=1
Secondary=2
Keyboard=3
PreviousTab=4
NextTab=5
Menu=6
SettingsModifier=7
CursorMode=8
